<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#070a14"/>
<title>LOVE METER NEO v0.4.0 beta.5 LOCAL AI - HOTFIX7</title>
<link rel="stylesheet" href="./styles.css?v=0.4.0b5h7"/>
</head>
<body>
<div id="app"><div id="boot-status" style="padding:28px;color:#d7def7;font-family:system-ui,sans-serif">LOVE METER NEO を起動しています…</div></div>
<script>
(()=>{
  const esc=(v)=>String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const app=document.getElementById('app');
  const render=(title,msg,details='')=>{
    if(!app)return;
    app.innerHTML=`<div style="max-width:900px;margin:48px auto;padding:28px;border:1px solid #ef5f78;border-radius:18px;background:#151929;color:#f7f8ff;font-family:system-ui,sans-serif"><h2 style="margin-top:0;color:#ff7e95">${esc(title)}</h2><p>${esc(msg)}</p>${details?`<pre style="white-space:pre-wrap;word-break:break-word;background:#090c15;padding:16px;border-radius:12px;color:#ffd9df">${esc(details)}</pre>`:''}<button onclick="location.reload()" style="padding:10px 16px;border:0;border-radius:10px;font-weight:700">再読み込み</button></div>`;
  };
  window.__lmShowBootError=(value,meta={})=>{
    const msg=String(value?.message||value?.reason?.message||value?.reason||value||'Unknown startup error');
    const stack=String(value?.stack||value?.reason?.stack||'');
    const details=[
      meta.filename?`File: ${meta.filename}`:'',
      meta.lineno?`Line: ${meta.lineno}${meta.colno?` / Column: ${meta.colno}`:''}`:'',
      stack?`Stack:\n${stack}`:''
    ].filter(Boolean).join('\n\n');
    render('起動エラー',msg,details||'位置情報が取得できませんでした。');
  };
  window.addEventListener('error',e=>{
    window.__lmShowBootError(e.error||e.message,{filename:e.filename,lineno:e.lineno,colno:e.colno});
  },true);
  window.addEventListener('unhandledrejection',e=>window.__lmShowBootError(e.reason));
})();
</script>
<script type="module" src="./src/app.js?v=0.4.0b5h7"></script>
</body>
</html>
